[project]
name = "aissaver-collector"
version = "0.1.0"
description = "Collects AIS positions for curated waterways and serves them to the e-ink screensaver"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10"]

[project.scripts]
aissaver-collector = "aissaver.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aissaver"]
